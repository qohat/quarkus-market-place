# ============================================================================
# Configuración de la aplicación
#
# Quarkus usa SmallRye Config (implementación de MicroProfile Config). Tres cosas
# que conviene tener claras desde el principio:
#
# 1. PERFILES. Un prefijo %perfil. aplica la propiedad solo en ese perfil.
#    Quarkus activa %dev en quarkusDev, %test en los tests y %prod en el resto.
#
# 2. PRIORIDAD (ordinal). De mayor a menor: propiedades de sistema (-D) >
#    variables de entorno > .env > este fichero. Una variable de entorno siempre
#    gana, que es lo que permite configurar un contenedor sin reconstruirlo.
#
#    El nombre se traduce: quarkus.http.port  ->  QUARKUS_HTTP_PORT
#
# 3. BUILD TIME vs RUNTIME. Algunas propiedades quedan CONGELADAS en el artefacto
#    durante la augmentation y no se pueden cambiar con una variable de entorno:
#    hay que reconstruir. La documentación las marca con un candado. Abajo se
#    señala cuáles lo son.
# ============================================================================


# ---------------------------------------------------------------- OpenAPI
# Metadatos del documento que se sirve en /q/openapi

quarkus.smallrye-openapi.info-title=Marketplace API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Marketplace híbrido: productos físicos con stock \
  y servicios reservables por franjas horarias.

# BUILD TIME. Por defecto Swagger UI solo se incluye en dev; activarlo en todos los
# perfiles es una decisión que se toma al compilar, no al desplegar.
#
# En una API pública, plantéate si quieres exponer la interfaz en producción: no es
# un agujero de seguridad por sí misma, pero sí regala un mapa completo de la
# superficie de ataque a cualquiera que pase por ahí.
quarkus.swagger-ui.always-include=true


# ------------------------------------------------------------------- Logs
# En desarrollo interesa ver lo que hace nuestro propio código; en producción, no.

%dev.quarkus.log.category."com.marketplace".level=DEBUG

# Los mappers de error registran en WARN las excepciones que traducen a 4xx.
# En test se silencian: los tests provocan esos errores a propósito y el ruido
# tapa los fallos de verdad.
%test.quarkus.log.category."com.marketplace.shared.infrastructure.rest".level=ERROR


# ------------------------------------------------------------------- HTTP
# El puerto 0 hace que los tests tomen un puerto libre cualquiera, de modo que
# varias ejecuciones simultáneas (o un quarkusDev abierto) no choquen entre sí.

%test.quarkus.http.test-port=0
