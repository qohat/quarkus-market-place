plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    // Serialización JSON para Quarkus REST. Arrastra Jackson y registra en build time
    // los readers/writers de cuerpo, sin descubrimiento por reflection en el arranque.
    implementation 'io.quarkus:quarkus-rest-jackson'
    // Bean Validation (Jakarta Validation con Hibernate Validator). Valida la FORMA del
    // payload en el borde; los invariantes de negocio siguen viviendo en el dominio.
    implementation 'io.quarkus:quarkus-hibernate-validator'
    // Genera el documento OpenAPI en build time a partir de los @Path, los DTOs y las
    // anotaciones de Bean Validation. Incluye Swagger UI.
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    // Persistencia: Hibernate ORM con la capa Panache encima, y el driver JDBC de PostgreSQL.
    // Declarar el driver es lo único que hace falta para que Dev Services levante la base de
    // datos en desarrollo y en test.
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    // Migraciones de esquema versionadas. El esquema deja de deducirse de las entidades.
    implementation 'io.quarkus:quarkus-flyway'
    // Cliente PostgreSQL reactivo (módulo 4). Convive con el driver JDBC pero es una pila
    // distinta: protocolo no bloqueante sobre el event loop, con su propio pool. Hace falta
    // porque Hibernate ORM es bloqueante de raíz, así que el modelo reactivo no puede
    // reutilizar la capa de persistencia que ya tenemos: hay que bajar a SQL.
    implementation 'io.quarkus:quarkus-reactive-pg-client'
    // Mensajería (módulo 7). SmallRye Reactive Messaging con conector de Kafka: los canales se
    // declaran con @Incoming/@Outgoing y se cablean en build time, igual que el resto de Quarkus.
    implementation 'io.quarkus:quarkus-messaging-kafka'
    // El relay del outbox y el barrido de reservas caducadas necesitan ejecución periódica.
    implementation 'io.quarkus:quarkus-scheduler'
    // Caché en memoria (módulo 9). @CacheResult / @CacheInvalidate como interceptores
    // generados en build time, sin proxies dinámicos: por eso funciona en nativo.
    implementation 'io.quarkus:quarkus-cache'
    // Resiliencia (módulo 8). MicroProfile Fault Tolerance: @Timeout, @Retry, @CircuitBreaker
    // y @Fallback como interceptores generados en build time.
    implementation 'io.quarkus:quarkus-smallrye-fault-tolerance'
    // Trazas distribuidas. El contexto viaja por cabeceras HTTP y, lo que aquí más importa,
    // también por las cabeceras de los mensajes de Kafka: la traza sobrevive al salto asíncrono.
    implementation 'io.quarkus:quarkus-opentelemetry'
    // Health checks en /q/health/live y /q/health/ready. No lo arrastra ninguna otra
    // extensión: hay que declararlo, y sin él esos endpoints simplemente no existen.
    implementation 'io.quarkus:quarkus-smallrye-health'
    // Métricas en formato Prometheus, servidas en /q/metrics.
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    // Dev Services de observabilidad: levanta Grafana + Loki + Tempo + Prometheus en un
    // contenedor, igual que hizo con PostgreSQL, Keycloak y Kafka.
    implementation 'io.quarkus:quarkus-observability-devservices-lgtm'
    // Seguridad (módulo 5). OIDC en modo `service`: la API valida el JWT que le llega en la
    // cabecera Authorization y no mantiene sesión. La validación es local, contra la clave
    // pública del emisor, sin una llamada de red por petición.
    implementation 'io.quarkus:quarkus-oidc'
    testImplementation 'io.quarkus:quarkus-junit'
    // Genera tokens firmados en los tests sin levantar Keycloak: los tests de autorización
    // no deberían depender de un contenedor para comprobar reglas de negocio.
    testImplementation 'io.quarkus:quarkus-test-security'
    testImplementation 'io.quarkus:quarkus-test-security-oidc'
    // Cliente para pedir tokens REALES al Keycloak de Dev Services. Hace falta para los pocos
    // tests que deben ejercitar la cadena completa —firma, emisor, caducidad, claim de roles—,
    // que es justo lo que @TestSecurity se salta por diseño.
    testImplementation 'io.quarkus:quarkus-test-keycloak-server'
    testImplementation 'io.rest-assured:rest-assured'
    // Espera activa con tiempo límite. Hace falta en el único punto donde la asincronía es
    // real —la vuelta por Kafka—: un Thread.sleep sería lento cuando funciona y engañoso
    // cuando falla.
    testImplementation 'org.awaitility:awaitility'
    // Cliente Kafka para los tests: permite publicar mensajes a mano y leer de un tema
    // directamente, que es la única forma de comprobar que la cola de mensajes muertos recibe
    // lo que debe.
    testImplementation 'io.quarkus:quarkus-test-kafka-companion'
}

group = 'org.acme'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
