# ============================================================================
# Configuración de la aplicación
#
# Quarkus usa SmallRye Config (implementación de MicroProfile Config). Tres cosas
# que conviene tener claras desde el principio:
#
# 1. PERFILES. Un prefijo %perfil. aplica la propiedad solo en ese perfil.
#    Quarkus activa %dev en quarkusDev, %test en los tests y %prod en el resto.
#
# 2. PRIORIDAD (ordinal). De mayor a menor: propiedades de sistema (-D) >
#    variables de entorno > .env > este fichero. Una variable de entorno siempre
#    gana, que es lo que permite configurar un contenedor sin reconstruirlo.
#
#    El nombre se traduce: quarkus.http.port  ->  QUARKUS_HTTP_PORT
#
# 3. BUILD TIME vs RUNTIME. Algunas propiedades quedan CONGELADAS en el artefacto
#    durante la augmentation y no se pueden cambiar con una variable de entorno:
#    hay que reconstruir. La documentación las marca con un candado. Abajo se
#    señala cuáles lo son.
# ============================================================================


# ---------------------------------------------------------------- OpenAPI
# Metadatos del documento que se sirve en /q/openapi

quarkus.smallrye-openapi.info-title=Marketplace API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Marketplace híbrido: productos físicos con stock \
  y servicios reservables por franjas horarias.

# BUILD TIME. Por defecto Swagger UI solo se incluye en dev; activarlo en todos los
# perfiles es una decisión que se toma al compilar, no al desplegar.
#
# En una API pública, plantéate si quieres exponer la interfaz en producción: no es
# un agujero de seguridad por sí misma, pero sí regala un mapa completo de la
# superficie de ataque a cualquiera que pase por ahí.
quarkus.swagger-ui.always-include=true


# ------------------------------------------------------------- Base de datos
#
# Esto es TODA la configuración de base de datos necesaria para desarrollo y test.
# No hay URL, ni usuario, ni contraseña, ni puerto. No es un descuido.
#
# DEV SERVICES: al ver un driver JDBC declarado y ninguna URL configurada, Quarkus
# arranca un contenedor PostgreSQL con Testcontainers, lo cablea solo y lo apaga al
# salir. Funciona igual en quarkusDev y en los tests.
#
# Ventaja real más allá de la comodidad: los tests corren contra el MISMO motor que
# producción. Usar H2 en test y PostgreSQL en producción es una fuente clásica de
# bugs que solo aparecen al desplegar, porque el SQL, los tipos y el comportamiento
# transaccional no son iguales.
#
# En producción sí hay que dar la URL, y sale de variables de entorno:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
# En cuanto esa URL existe, Dev Services se desactiva solo.

quarkus.datasource.db-kind=postgresql

# ---- Esquema: lo gobierna Flyway, no Hibernate ----
#
# Por defecto, con una base gestionada por Dev Services, Quarkus pone la estrategia
# en drop-and-create: Hibernate genera las tablas deduciéndolas de las entidades.
# Es cómodo para empezar y una trampa a medio plazo, porque el esquema real acaba
# siendo lo que Hibernate improvise, sin control de versiones ni forma de reproducir
# en producción lo que tienes en local.
#
# Con migraciones versionadas la relación se invierte: el esquema es el contrato, y
# las entidades tienen que encajar en él.
#
#   validate  ->  Hibernate NO toca el esquema; solo comprueba al arrancar que las
#                 entidades encajan con las tablas que creó Flyway. Si añades un
#                 campo a una entidad y olvidas la migración, la aplicación no
#                 arranca. Es la red de seguridad que hace segura esta separación.

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# ---- Estadísticas de Hibernate ----
#
# Cuentan, entre otras cosas, cuántas sentencias JDBC se ejecutan. Es lo que permite
# escribir tests de «presupuesto de consultas»: fijar cuántas consultas puede hacer un
# endpoint y fallar el build si aparece una de más.
#
# Es la forma fiable de que un problema N+1 no llegue a producción. Un N+1 no rompe
# nada ni sale en los logs: solo hace que la aplicación vaya lenta cuando hay datos
# de verdad, que es cuando ya es tarde.
#
# En dev también, para poder mirar el contador desde la Dev UI.
%test.quarkus.hibernate-orm.statistics=true
%dev.quarkus.hibernate-orm.statistics=true

# Ver el SQL que Hibernate emite realmente, formateado. Impagable para entender qué
# está pasando; desactivado fuera de dev porque es ruidoso y costoso.
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true

# Las migraciones viven en src/main/resources/db/migration, con nombres
# V<versión>__<descripción>.sql. Flyway registra las aplicadas en la tabla
# flyway_schema_history y no repite ninguna.


# ------------------------------------------------------------------- Logs
# En desarrollo interesa ver lo que hace nuestro propio código; en producción, no.

%dev.quarkus.log.category."com.marketplace".level=DEBUG

# Los mappers de error registran en WARN las excepciones que traducen a 4xx.
# En test se silencian: los tests provocan esos errores a propósito y el ruido
# tapa los fallos de verdad.
%test.quarkus.log.category."com.marketplace.shared.infrastructure.rest".level=ERROR


# ------------------------------------------------------------------ Seguridad
#
# MODO service (bearer token). La API espera un JWT en la cabecera
#   Authorization: Bearer <token>
# y responde 401 si no lo hay. No redirige a ninguna pantalla de login ni guarda
# sesión: eso es el modo web-app, para aplicaciones que renderizan HTML.
#
# Sin sesión en el servidor, cualquier instancia puede atender cualquier petición.
# Es lo que permite escalar horizontalmente sin almacén de sesiones compartido.

quarkus.oidc.application-type=service

# DENEGAR POR DEFECTO. Sin esto, un endpoint sin anotación de seguridad queda ABIERTO, y el
# día que alguien añada uno y olvide anotarlo habrá un agujero que ninguna prueba detecta:
# el endpoint funciona, simplemente funciona para cualquiera.
#
# Con esta línea, olvidarse produce un 403 en el primer intento. El fallo pasa de ser
# silencioso y peligroso a ruidoso e inofensivo, que es como deben fallar las cosas.
#
# El precio es que hay que declarar explícitamente lo que sí es público, con @PermitAll. Es
# un precio justo: obliga a que abrir un endpoint sea una decisión escrita, no un descuido.
quarkus.security.deny-unannotated-endpoints=true

# En el módulo 4 aprendimos que los roles pueden venir en distintos claims según cómo esté
# configurado el emisor. Con el scope microprofile-jwt de Dev Services llegan en `groups`,
# que es lo que Quarkus entiende de fábrica. Contra un Keycloak de producción suelen estar
# en realm_access.roles, y entonces hace falta:
#   quarkus.oidc.roles.role-claim-path=realm_access/roles
# Sin esa línea, @RolesAllowed rechaza a todo el mundo aunque el token traiga los roles.

# DEV SERVICES DE KEYCLOAK: igual que con PostgreSQL, al no configurar
# quarkus.oidc.auth-server-url Quarkus levanta un Keycloak en un contenedor, crea un
# realm y cablea la aplicación solo.
#
# Los usuarios por defecto son alice y bob; aquí se declaran los del dominio, con los
# dos roles del marketplace. La contraseña es igual al nombre de usuario.
%dev,test.quarkus.keycloak.devservices.users.vendedora=vendedora
%dev,test.quarkus.keycloak.devservices.roles.vendedora=seller
%dev,test.quarkus.keycloak.devservices.users.comprador=comprador
%dev,test.quarkus.keycloak.devservices.roles.comprador=buyer
# Un segundo vendedor: sin él no se puede probar lo único que de verdad importa,
# que un vendedor NO pueda tocar las publicaciones de otro.
%dev,test.quarkus.keycloak.devservices.users.rival=rival
%dev,test.quarkus.keycloak.devservices.roles.rival=seller

# Reutilizar el contenedor entre ejecuciones. Keycloak tarda bastante más en arrancar que
# PostgreSQL, y sin esto cada `./gradlew test` paga ese arranque entero.
%dev,test.quarkus.keycloak.devservices.service-name=marketplace-keycloak
%dev,test.quarkus.devservices.reuse=true


# ------------------------------------------------------------------- HTTP
# El puerto 0 hace que los tests tomen un puerto libre cualquiera, de modo que
# varias ejecuciones simultáneas (o un quarkusDev abierto) no choquen entre sí.

%test.quarkus.http.test-port=0


# ------------------------------------------------------------- Perfil bench
#
# Perfil dedicado a medir concurrencia (módulo 4). Existe por dos razones:
#
# 1. El benchmark tiene que correr sobre un artefacto de PRODUCCIÓN. En dev mode
#    hay live reload, instrumentación y agentes cargados: medir ahí da números que
#    no significan nada.
#
# 2. Los endpoints del laboratorio duermen a petición del cliente, que es un DoS
#    regalado. Con @IfBuildProfile("bench") ARC los elimina del artefacto normal:
#    no quedan protegidos, quedan inexistentes. Compruébalo tú mismo con
#    ./scripts/inspeccionar-arc.sh.
#
# Se construye y se arranca así:
#   ./gradlew quarkusBuild -Dquarkus.profile=bench
#   java -Dquarkus.profile=bench -jar build/quarkus-app/quarkus-run.jar
#
# La base de datos es un contenedor levantado a mano (Dev Services solo actúa en
# dev y test), para que el escenario con base de datos real sea reproducible:
#   docker run -d --name mp-bench-db -e POSTGRES_USER=marketplace \
#     -e POSTGRES_PASSWORD=marketplace -e POSTGRES_DB=marketplace \
#     -p 55432:5432 postgres:18

%bench.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/marketplace
%bench.quarkus.datasource.username=marketplace
%bench.quarkus.datasource.password=marketplace

# El cliente reactivo tiene su propia URL y su propio pool: es otra pila completa contra la
# misma base de datos.
%bench.quarkus.datasource.reactive.url=postgresql://localhost:55432/marketplace

# IGUALAR LOS DOS POOLS ES OBLIGATORIO PARA QUE LA COMPARACIÓN SIGNIFIQUE ALGO.
#
# Los valores por defecto NO coinciden entre las dos pilas: midiendo sin fijarlos, el modelo
# reactivo salía 2,6 veces más lento y la conclusión fácil habría sido «el reactivo rinde
# peor». Contando conexiones en pg_stat_activity durante la carga aparecieron ~50 conexiones
# activas en la pila JDBC frente a ~21 en la reactiva: no se estaban comparando dos modelos
# de concurrencia, sino dos tamaños de pool.
#
# Es el error de bulto más común al comparar tecnologías: cambiar dos variables a la vez y
# atribuir la diferencia a la que uno tenía en mente.
%bench.quarkus.datasource.jdbc.max-size=20
%bench.quarkus.datasource.reactive.max-size=20

# Las estadísticas de Hibernate cuestan tiempo en el camino caliente. Fuera.
%bench.quarkus.hibernate-orm.statistics=false
%bench.quarkus.log.category."com.marketplace".level=WARN

# ---- Los dos números que decide todo este módulo ----
#
# Se dejan en su valor POR DEFECTO a propósito: el objetivo es medir qué pasa con
# la configuración que trae Quarkus de fábrica, que es con la que arranca el 90 %
# de los proyectos. Están escritos aquí solo para tenerlos a la vista.
#
#   quarkus.thread-pool.max-threads     = 200   hilos de worker (modelo bloqueante)
#   quarkus.datasource.jdbc.max-size    = 20    conexiones a la base de datos
#
# La ley de Little con estos números:
#   200 workers  / 100 ms  = 2.000 req/s de techo teórico en el escenario sintético
#    20 conexiones / 10 ms =  2.000 req/s de techo con base de datos
#
# La hipótesis del módulo es que en el segundo escenario los tres modelos de
# concurrencia convergen, porque el límite deja de estar en los hilos.
